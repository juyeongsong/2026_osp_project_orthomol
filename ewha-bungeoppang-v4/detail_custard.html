<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슈크림빵 - 상품 상세 - 이화 붕어빵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page detail-page">
    <header class="awning-wrap">
  <div class="awning"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <a href="main.html" id="logoLink" aria-label="이화 붕어빵 홈"><img class="logo-img mini" src="images/logo.png" alt="이화 붕어빵"></a>
  ...
</header>

    <main class="detail-main">
      <div class="detail-center">
      <a href="main.html" class="back-link" id="backLink">목록으로 돌아가기</a>

      <section class="detail-card">
        <span class="badge preparing">준비 중</span>

        <div class="detail-img">
          <div class="fish">
            <img src="images/fish.png" alt="슈크림빵"><i style="--fill:#F2E6B0"></i>
          </div>
          <a class="review-link" href="reviews.html">후기 보기</a>
        </div>

        <div class="detail-info">
          <h1>슈크림빵</h1>
          <p class="desc">입안에서 부드럽게 사르르 녹아내리는<br>달콤한 슈크림이 듬뿍!<br>바삭한 반죽과 부드러운 크림의 조화가 매력적인<br>인기만점 붕어빵입니다.</p>
          <div class="price-row">
            <span id="price" data-unit="500">500원</span>
            <div class="qty">
              <button type="button" id="minus" disabled aria-label="수량 감소">-</button>
              <output id="qty">1</output>
              <button type="button" id="plus" disabled aria-label="수량 증가">+</button>
            </div>
          </div>
          <button type="button" class="btn-green" id="buy" disabled>구매하기</button>
          <p class="status-note">현재 준비 중인 상품입니다.</p>
        </div>
      </section>
      </div>
    </main>

    <footer class="site-footer"><b>문의 상담</b> | <b>이화 붕어빵</b> 02-123-4567</footer>
  </div>

  <script>
    // 로그인 상태에 따라 돌아갈 메인 페이지 결정
    var loggedIn = false;
    try { loggedIn = localStorage.getItem('loggedIn') === 'true'; } catch (e) {}
    var mainUrl = loggedIn ? 'login_after_login.html' : 'main.html';
    ['backLink', 'homeLink', 'logoLink'].forEach(function (id) {
      document.getElementById(id).setAttribute('href', mainUrl);
    });

    // 수량 조절
    var qty = 1;
    var qtyEl = document.getElementById('qty');
    var priceEl = document.getElementById('price');
    var unit = Number(priceEl.dataset.unit);
    function render() {            // 수량 × 단가로 가격 갱신
      qtyEl.textContent = qty;
      priceEl.textContent = (unit * qty).toLocaleString('ko-KR') + '원';
    }
    document.getElementById('minus').addEventListener('click', function () {
      if (qty > 1) { qty--; render(); }
    });
    document.getElementById('plus').addEventListener('click', function () {
      if (qty < 99) { qty++; render(); }
    });

    // 구매하기
    document.getElementById('buy').addEventListener('click', function () {
      var total = (500 * qty).toLocaleString('ko-KR');
      alert('슈크림빵 ' + qty + '개 (' + total + '원) 구매가 접수되었습니다.');
    });
  </script>
</body>
</html>
