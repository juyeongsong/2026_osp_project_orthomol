<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이화 붕어빵 - 로그인 후</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="awning-wrap">
      <div class="awning"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <img class="logo-img big" src="images/logo.png" alt="이화 붕어빵">
    </header>

    <main class="main-wrap">
      <nav class="menu">
        <div class="menu-buttons">
        <a class="btn-green" href="today.html">오늘의 붕어빵은?</a>
        <a class="btn-green" href="register.html">상품 등록하기</a>
        <a class="btn-green" href="reviews.html">후기 보기</a>
        </div>
        <div class="auth-links">
          <a href="main.html" id="logout">로그아웃</a>
        </div>
      </nav>

      <section class="product-panel">
        <div class="product-grid">
        <a class="card-wrap" href="detail_red-bean.html">
          <div class="product-card">
            <span class="badge">판매 중</span>
            <div class="fish"><img src="images/fish.png" alt="팥 붕어빵"><i style="--fill:#8B0000"></i></div>
            <p class="product-name">팥 붕어빵</p>
            <p class="product-price">500원</p>
          </div>
        </a>
        <a class="card-wrap inactive" href="detail_custard.html">
          <div class="product-card">
            <span class="badge preparing">준비 중</span>
            <div class="fish"><img src="images/fish.png" alt="슈크림 붕어빵"><i style="--fill:#F2E6B0"></i></div>
            <p class="product-name">슈크림 붕어빵</p>
            <p class="product-price">500원</p>
          </div>
        </a>
        <a class="card-wrap" href="detail_matcha.html">
          <div class="product-card">
            <span class="badge">판매 중</span>
            <div class="fish"><img src="images/fish.png" alt="말차 붕어빵"><i style="--fill:#4B5A1E"></i></div>
            <p class="product-name">말차 붕어빵</p>
            <p class="product-price">800원</p>
          </div>
        </a>
        <a class="card-wrap inactive" href="detail_sweet-potato.html">
          <div class="product-card">
            <span class="badge soldout">품절</span>
            <div class="fish"><img src="images/fish.png" alt="고구마 붕어빵"><i style="--fill:#E0A800"></i></div>
            <p class="product-name">고구마 붕어빵</p>
            <p class="product-price">800원</p>
          </div>
        </a>
        <a class="card-wrap" href="detail_strawberry.html">
          <div class="product-card">
            <span class="badge">판매 중</span>
            <div class="fish"><img src="images/fish.png" alt="딸기슈크림 붕어빵"><i style="--fill:radial-gradient(circle, #FF8E8E 0%, #FFFAB0 100%)"></i></div>
            <p class="product-name">딸기슈크림 붕어빵</p>
            <p class="product-price">1,000원</p>
          </div>
        </a>
        <a class="card-wrap" href="detail.html">
          <div class="product-card">
            <span class="badge">판매 중</span>
            <div class="fish"><img src="images/fish.png" alt="피자 붕어빵"><i style="--fill:#FF4A1C"></i></div>
            <p class="product-name">피자 붕어빵</p>
            <p class="product-price">1,000원</p>
          </div>
        </a>
        </div>
        <div class="pager">
          <button type="button" aria-label="이전">◀</button>
          <span class="page-num">1</span>
          <button type="button" aria-label="다음">▶</button>
        </div>
      </section>
    </main>

    <footer class="site-footer"><b>문의 상담</b> | <b>이화 붕어빵</b> 02-123-4567</footer>
  </div>
  <script>
    // 로그아웃: 로그인 상태를 지우고 main.html로 이동 (href로 페이지 전환)
    document.getElementById('logout').addEventListener('click', function () {
      try { localStorage.removeItem('loggedIn'); } catch (e) {}
    });
  </script>
</body>
</html>
