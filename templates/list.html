{% extends "index.html" %} {% block content %}
<div class="grid">
  {% for p in items %}
  <div class="card">
    <div class="name">{{ p.name }}</div>
    <a href="{{ url_for('product_detail', product_id=p.id) }}">
      <img
        src="{{ url_for('static', filename='images/' + p.image) }}"
        alt="{{ p.name }}"
      />
    </a>
  </div>
  {% endfor %}
</div>

<div class="pagination">
  {% if page > 1 %}
  <a href="{{ url_for('list_products', page=page-1) }}">Prev</a>
  {% endif %} {% for n in range(1, total_pages + 1) %} {% if n == page %}<strong
    >{{ n }}</strong
  >{% else %} <a href="{{ url_for('list_products', page=n) }}">{{ n }}</a>{%
  endif %} {% endfor %} {% if page < total_pages %}
  <a href="{{ url_for('list_products', page=page+1) }}">Next</a>
  {% endif %}
</div>
{% endblock %}
