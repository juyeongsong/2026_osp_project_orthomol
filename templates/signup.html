{% extends "index.html" %} {% block section %} {% if error %}
<script>
  alert("{{ error }}");
</script>
{% endif %}

<h2>회원가입</h2>

<form method="post" action="/signup_post">
  <p>
    ID
    <input type="text" name="id" required />
  </p>

  <p>
    Password
    <input type="password" name="pw" required />
  </p>

  <p>
    Nickname
    <input type="text" name="nickname" />
  </p>

  <p>
    Input ID and password, and click the create button<br />
    <input type="submit" value="Create" />
  </p>
</form>

{% endblock section %}
