{% extends "index.html" %}
{% block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/bungeo.css') }}"
/>

<h1 class="page-title">후기 작성</h1>

<div class="page-body">
  {% with messages = get_flashed_messages() %}
  {% if messages %}<p class="form-error">{{ messages[0] }}</p>{% endif %}
  {% endwith %}

  <form
    class="review-card"
    action="{{ url_for('reg_review_submit_post') }}"
    method="post"
    enctype="multipart/form-data"
  >
    <div class="field span-5">
      <label for="user-id">아이디</label>
      <input type="text" id="user-id" name="id" required />
    </div>

    <div class="field span-7">
      <label for="product">상품명</label>
      <input
        type="text"
        id="product"
        name="product"
        value="{{ product }}"
        {{ 'readonly' if product }}
        placeholder="예) 팥 붕어빵"
        required
      />
    </div>

    <div class="field span-8">
      <label for="title">제목</label>
      <input type="text" id="title" name="title" required />
    </div>

    <fieldset class="field span-4 stars">
      <legend>별점</legend>
      <div class="stars__row">
        <input type="radio" id="star5" name="rating" value="5" required />
        <label for="star5" title="5점">★</label>
        <input type="radio" id="star4" name="rating" value="4" />
        <label for="star4" title="4점">★</label>
        <input type="radio" id="star3" name="rating" value="3" />
        <label for="star3" title="3점">★</label>
        <input type="radio" id="star2" name="rating" value="2" />
        <label for="star2" title="2점">★</label>
        <input type="radio" id="star1" name="rating" value="1" />
        <label for="star1" title="1점">★</label>
      </div>
    </fieldset>

    <div class="field span-8">
      <label for="content">내용</label>
      <textarea
        id="content"
        name="content"
        placeholder="맛, 식감 등 솔직한 후기를 남겨주세요!"
        required
      ></textarea>
    </div>

    <div class="field span-4">
      <span class="field__label" id="photo-label">사진 추가</span>
      <label class="dropzone" for="photo" aria-labelledby="photo-label">
        <span class="dropzone__text">
          클릭해서 사진 업로드<br />(JPG, PNG)
        </span>
        <img class="dropzone__preview" alt="선택한 사진 미리보기" hidden />
      </label>
      <input
        type="file"
        id="photo"
        name="file_input"
        accept="image/jpeg,image/png"
        class="sr-only"
      />
    </div>

    <div class="actions span-12">
      <button type="button" class="btn btn--ghost" id="cancel">취소</button>
      <button type="submit" class="btn btn--primary">등록하기</button>
    </div>
  </form>
</div>

<script>
  // 취소: 이전 페이지로
  document.getElementById("cancel").addEventListener("click", () => history.back());

  // 선택한 사진 미리보기
  document.getElementById("photo").addEventListener("change", (e) => {
    const file = e.target.files[0];
    const preview = document.querySelector(".dropzone__preview");
    const text = document.querySelector(".dropzone__text");
    if (!file) {
      preview.hidden = true;
      text.hidden = false;
      return;
    }
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    text.hidden = true;
  });
</script>
{% endblock %}
